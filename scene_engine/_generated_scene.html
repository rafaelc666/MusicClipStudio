<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Scene Engine | Vox editorial</title>
  <style>
    :root { --ink:#151515; --paper:#eee9dc; --blue:#1769e0; --yellow:#f2d313; --cream:#faf7ed; --green:#55b879; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:#101216; color:var(--cream); font-family:Georgia,serif; display:grid; place-items:center; }
    .stage { width:min(92vw,1100px); aspect-ratio:16/9; overflow:hidden; position:relative; isolation:isolate; background:var(--paper); color:var(--ink); box-shadow:0 22px 60px #000; }
    .layer { position:absolute; inset:0; pointer-events:none; }
    .background { background:linear-gradient(120deg,#d7d2c1,#f5f0e2 47%,#8db7cf); transform:scale(1.08); animation:camera 8s ease-in-out infinite alternate; }
    .background::after { content:""; position:absolute; inset:0; background:linear-gradient(90deg,#111c2c66,#0000 56%),radial-gradient(circle at 70% 45%,#fff8 0 2%,transparent 24%); mix-blend-mode:multiply; }
    .paper { opacity:.22; background-image:radial-gradient(#151515 1px,transparent 1px); background-size:7px 7px; mix-blend-mode:multiply; animation:drift 9s linear infinite; }
    .foreground { inset:auto -8% -12% 42%; height:62%; background:#172338; clip-path:polygon(18% 0,100% 20%,100% 100%,0 100%); opacity:.82; transform:translateX(0); animation:front 8s ease-in-out infinite alternate; }
    .headline { inset:12% auto auto 8%; width:64%; font-size:clamp(26px,5vw,72px); line-height:.92; font-weight:900; letter-spacing:-2px; text-transform:uppercase; animation:headline 8s ease-in-out infinite; }
    .headline em { color:var(--blue); font-style:normal; display:block; }
    .rule { position:absolute; width:16%; height:8px; left:8%; top:49%; background:var(--blue); transform-origin:left; animation:rule 8s ease-in-out infinite; }
    .stat { left:auto; top:auto; right:8%; bottom:18%; width:25%; padding:14px; background:var(--yellow); border:3px solid var(--ink); transform:rotate(-3deg); animation:card 8s ease-in-out infinite; }
    .waveform { position:absolute; left:8%; bottom:20%; width:32%; height:12%; display:flex; align-items:center; gap:4px; animation:wave-in 8s ease-in-out infinite; }
    .waveform i { display:block; flex:1; background:var(--blue); transform-origin:center; animation:pulse 900ms ease-in-out infinite alternate; }
    .waveform i:nth-child(2n) { background:var(--ink); animation-delay:120ms; }
    .waveform i:nth-child(3n) { background:var(--yellow); animation-delay:240ms; }
    .lower-third { position:absolute; right:8%; top:10%; padding:10px 14px; background:var(--ink); color:var(--cream); border-left:8px solid var(--blue); animation:lower 8s ease-in-out infinite; }
    .lower-third strong { display:block; font:800 15px Arial,sans-serif; text-transform:uppercase; }
    .lower-third small { color:var(--yellow); font:700 10px Arial,sans-serif; text-transform:uppercase; }
    .number { font:900 clamp(30px,5vw,68px)/.9 Georgia,serif; }
    .label { font:700 12px/1.1 Arial,sans-serif; text-transform:uppercase; margin-top:5px; }
    .caption { position:absolute; left:8%; bottom:9%; font:700 11px Arial,sans-serif; letter-spacing:1px; text-transform:uppercase; }
    .controls { position:fixed; left:20px; bottom:20px; display:flex; gap:8px; }
    button { border:1px solid #777; background:#222; color:#fff; padding:8px 12px; cursor:pointer; border-radius:4px; }
    button:hover { background:#444; }
    .paused * { animation-play-state:paused !important; }
    @keyframes camera { from{transform:scale(1.08) translate(-1%,-1%)} to{transform:scale(1.16) translate(2%,1%)} }
    @keyframes drift { from{background-position:0 0} to{background-position:42px 24px} }
    @keyframes front { from{transform:translateX(4%)} to{transform:translateX(-4%)} }
    @keyframes headline { 0%,10%{opacity:0;transform:translateX(-35px)} 22%,78%{opacity:1;transform:translateX(0)} 92%,100%{opacity:0;transform:translateX(20px)} }
    @keyframes rule { 0%,15%{transform:scaleX(0)} 25%,80%{transform:scaleX(1)} 92%,100%{transform:scaleX(0)} }
    @keyframes card { 0%,28%{opacity:0;transform:translateY(25px) rotate(-3deg)} 40%,78%{opacity:1;transform:translateY(0) rotate(-3deg)} 92%,100%{opacity:0;transform:translateY(-12px) rotate(-3deg)} }
    @keyframes pulse { from{height:18%} to{height:100%} }
    @keyframes wave-in { 0%,20%{opacity:0;transform:translateX(-30px)} 32%,78%{opacity:1;transform:translateX(0)} 92%,100%{opacity:0} }
    @keyframes lower { 0%,35%{opacity:0;transform:translateX(30px)} 45%,78%{opacity:1;transform:translateX(0)} 92%,100%{opacity:0} }
    @media(max-width:650px){.headline{width:76%;}.stat{right:5%;width:31%;}.caption{bottom:5%;}}
  </style>
</head>
<body>
  <section class="stage" id="stage" aria-label="Demonstração de cena em camadas">
    <div class="layer background" data-layer="background"></div>
    <div class="layer paper" data-layer="paper-texture"></div>
    <div class="layer headline" data-layer="headline">O<br>detalhe<br><em>que muda a história</em></div>
    <div class="rule" data-layer="headline-rule"></div>
    <div class="stat" data-layer="stat-card"><div class="number" id="number">860 V</div><div class="label">descarga registrada</div></div>
    <div class="waveform" data-layer="waveform" aria-label="Forma de onda"></div>
    <div class="lower-third" data-layer="lower-third"><strong>Arquivo Vox</strong><small>Demonstração editorial</small></div>
    <div class="layer foreground" data-layer="foreground"></div>
    <div class="caption">Arquivo visual / demonstração editorial</div>
  </section>
  <div class="controls"><button id="toggle">Pausar</button><button id="restart">Recomeçar</button></div>
  <script>
    const stage = document.getElementById('stage');
    const waveform = document.querySelector('[data-layer="waveform"]');
    [22,38,62,45,78,34,56,88,42,68,30,74,50,82,36,64].forEach(height => { const bar = document.createElement('i'); bar.style.height = `${height}%`; waveform.appendChild(bar); });
    const number = document.getElementById('number');
    let started = performance.now();
    function tick(now) { const seconds = Math.min(1, (now - started) / 3000); number.textContent = Math.round(860.0 * seconds); requestAnimationFrame(tick); }
    requestAnimationFrame(tick);
    document.getElementById('toggle').onclick = event => { stage.classList.toggle('paused'); event.currentTarget.textContent = stage.classList.contains('paused') ? 'Continuar' : 'Pausar'; };
    document.getElementById('restart').onclick = () => { started = performance.now(); stage.classList.remove('paused'); document.getElementById('toggle').textContent = 'Pausar'; };
  </script>
</body>
</html>
