<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene Composition - Vox Editorial</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #1A1A2E;
            --bg-secondary: #16213E;
            --accent: #FFCC00;
            --accent-alt: #FF3333;
            --text-primary: #FFFFFF;
            --text-secondary: #B8B8D1;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 1920px;
            height: 1080px;
            background: var(--bg-primary);
            overflow: hidden;
            font-family: 'Inter', sans-serif;
        }
        .scene {
            position: relative;
            width: 100%;
            height: 100%;
        }
        .beat {
            position: absolute;
            inset: 0;
            opacity: 0;
            animation: beatIn 1s ease-out forwards;
            animation-delay: var(--delay, 0s);
        }
        @keyframes beatIn {
            0% { opacity: 0; }
            10% { opacity: 1; }
            85% { opacity: 1; }
            100% { opacity: 0; }
        }
        .grain {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.04;
            mix-blend-mode: overlay;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        }
        .controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 10000;
        }
        button {
            padding: 10px 20px;
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            cursor: pointer;
            border-radius: 4px;
        }
        button:hover { background: rgba(255,255,255,0.3); }
    </style>
</head>
<body>
    <div class="scene">
        <!-- Beats serão injetados aqui -->
        <div class="grain"></div>
    </div>
    <div class="controls">
        <button onclick="togglePlay()">Play/Pause</button>
        <button onclick="restart()">Restart</button>
    </div>
    <script>
        let paused = false;
        function togglePlay() {
            paused = !paused;
            document.querySelectorAll('*').forEach(el => {
                if (getComputedStyle(el).animationName !== 'none') {
                    el.style.animationPlayState = paused ? 'paused' : 'running';
                }
            });
        }
        function restart() { location.reload(); }
    </script>
</body>
</html>
